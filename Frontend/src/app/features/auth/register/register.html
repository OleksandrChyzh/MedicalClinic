<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Створити акаунт</h2>
      <p>Приєднуйтесь до нашої клініки вже сьогодні</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label>Ім'я користувача</label>
        <div class="input-wrapper">
          <span class="icon">👤</span>
          <input type="text" formControlName="userName" placeholder="Іван Іванов">
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <div class="input-wrapper">
          <span class="icon">✉️</span>
          <input type="email" formControlName="email" placeholder="example@mail.com">
        </div>
      </div>

      <div class="form-group">
        <label>Номер телефону (опціонально)</label>
        <div class="input-wrapper">
          <span class="icon">📞</span>
          <input type="text" formControlName="phoneNumber" placeholder="+380...">
        </div>
      </div>

      <div class="form-group">
        <label>Пароль</label>
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input type="password" formControlName="password" placeholder="••••••••">
        </div>
      </div>

      @if (errorMessage()) {
        <div class="alert alert-danger">{{ errorMessage() }}</div>
      }

      <button type="submit" class="btn btn-primary btn-block" [disabled]="registerForm.invalid || isLoading()">
        @if (isLoading()) { <span class="spinner"></span> }
        Зареєструватися
      </button>
    </form>

    <div class="auth-footer">
      <p>Вже є акаунт? <a routerLink="/login">Увійти</a></p>
    </div>
  </div>
</div>

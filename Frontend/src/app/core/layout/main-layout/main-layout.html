<app-navbar></app-navbar>

<div class="main-shell">
  @if (isLoggedIn()) {
    <aside class="dashboard-sidebar">
      <div class="sidebar-menu">
        @if (hasRole('Admin')) {
          <a routerLink="/admin/users" routerLinkActive="active" class="menu-item">
            <span class="icon">👥</span> Користувачі
          </a>
          <a routerLink="/admin/appointments" routerLinkActive="active" class="menu-item">
            <span class="icon">📅</span> Всі записи
          </a>
          <a routerLink="/admin/statistics" routerLinkActive="active" class="menu-item">
            <span class="icon">📊</span> Статистика
          </a>
        } @else if (hasRole('Doctor')) {
          <a routerLink="/doctor/appointments" routerLinkActive="active" class="menu-item">
            <span class="icon">📅</span> Мої записи
          </a>
          <a routerLink="/doctor/schedule" routerLinkActive="active" class="menu-item">
            <span class="icon">🕒</span> Мій розклад
          </a>
          <a routerLink="/doctor/profile" routerLinkActive="active" class="menu-item">
            <span class="icon">👤</span> Мій профіль
          </a>
        } @else {
          <a routerLink="/user/profile" routerLinkActive="active" class="menu-item">
            <span class="icon">👤</span> Профіль
          </a>
          <a routerLink="/user/appointments" routerLinkActive="active" class="menu-item">
            <span class="icon">📅</span> Мої записи
          </a>
          <a routerLink="/user/patients" routerLinkActive="active" class="menu-item">
            <span class="icon">🗂️</span> Мої пацієнти
          </a>
          <a routerLink="/user/settings" routerLinkActive="active" class="menu-item">
            <span class="icon">⚙️</span> Налаштування
          </a>
        }
      </div>
    </aside>
  }

  <main class="shell-content">
    <router-outlet></router-outlet>
  </main>
</div>

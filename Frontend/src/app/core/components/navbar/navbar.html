    </a>

    <nav class="navbar__nav">
      <ul class="nav-list">
        <li class="nav-item">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Головна</a>
        </li>
        <li class="nav-item">
          <a routerLink="/emergency" routerLinkActive="active">Невідкладна допомога</a>
        </li>
        <li class="nav-item">

        </li>
        <li class="nav-item">

        </li>

    <div class="navbar__actions">
